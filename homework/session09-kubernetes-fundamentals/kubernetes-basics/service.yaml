# Equivalent of:
#   kubectl expose deployment/kubernetes-bootcamp --type=NodePort --port 8080
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-bootcamp
  labels:
    app: kubernetes-bootcamp
spec:
  type: NodePort
  selector:
    app: kubernetes-bootcamp
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

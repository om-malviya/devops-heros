apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-rolling
  namespace: s10
  labels:
    app: web-rolling
  annotations:
    kubernetes.io/change-cause: "deploy v1"
spec:
  replicas: 4
  revisionHistoryLimit: 10
  # RollingUpdate replaces pods gradually.
  # maxSurge: 1       -> at most 1 extra pod above 4 during the rollout (max 5 pods)
  # maxUnavailable: 0 -> never drop below 4 ready pods (zero downtime)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-rolling
  template:
    metadata:
      labels:
        app: web-rolling
        version: v1
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=v1"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3

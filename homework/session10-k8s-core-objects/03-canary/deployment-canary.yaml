apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: s10
  labels:
    app: web
    track: canary
spec:
  # 1 canary pod out of 10 total = ~10% of traffic.
  # Scale this up / stable down to shift more traffic to the canary.
  replicas: 1
  selector:
    matchLabels:
      app: web
      track: canary
  template:
    metadata:
      labels:
        app: web
        track: canary
        version: v2
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=canary-v2"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-recreate
  namespace: s10
  labels:
    app: web-recreate
  annotations:
    kubernetes.io/change-cause: "deploy v1"
spec:
  replicas: 3
  # Recreate: ALL old pods are terminated before ANY new pod is created.
  # Guarantees two versions never run together, at the cost of downtime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-recreate
  template:
    metadata:
      labels:
        app: web-recreate
        version: v1
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=v1"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3

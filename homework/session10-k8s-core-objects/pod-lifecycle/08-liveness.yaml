# The app creates /tmp/healthy, deletes it after 20 s and keeps running.
# The liveness probe then fails twice and the kubelet restarts the container:
# RESTARTS increases, the Pod itself is not recreated.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
  namespace: s10
  labels:
    lab: pod-lifecycle
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'App started'; touch /tmp/healthy; sleep 20; rm /tmp/healthy; echo 'Health file removed'; sleep 300"]
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/healthy"]
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2

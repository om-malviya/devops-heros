# Slow starter: needs 30 s before it is "started". The startup probe allows up
# to 10 x 5 s = 50 s; liveness only begins once the startup probe succeeds,
# so the slow start does not cause restarts.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
  namespace: s10
  labels:
    lab: pod-lifecycle
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Application starting...'; sleep 30; touch /tmp/started; echo 'Application started'; sleep 300"]
      startupProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/started"]
        periodSeconds: 5
        failureThreshold: 10
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/started"]
        periodSeconds: 5
        failureThreshold: 1

# The init container must finish (10 s) before the main container starts.
# STATUS: Init:0/1 -> PodInitializing -> Running
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  namespace: s10
  labels:
    lab: pod-lifecycle
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Init container running'; sleep 10; echo 'Init complete'"]
  containers:
    - name: app
      image: nginx:alpine
      ports:
        - containerPort: 80

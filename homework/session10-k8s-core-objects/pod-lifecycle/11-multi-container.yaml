# Two containers in one Pod share network namespace and volumes.
# READY shows 2/2 once both are running.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  namespace: s10
  labels:
    lab: pod-lifecycle
spec:
  containers:
    - name: app
      image: nginx:alpine
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"Sidecar: nginx says $(wget -qO- -T 2 http://127.0.0.1 | head -c 15)...\"; sleep 10; done"]

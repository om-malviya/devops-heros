# Shared in-cluster client for every Service test in this session.
# busybox has wget (HTTP), nslookup (DNS) and cat /etc/resolv.conf.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: s11
  labels:
    role: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi

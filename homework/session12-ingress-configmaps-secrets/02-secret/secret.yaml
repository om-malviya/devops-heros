# Task 2 - Secret with base64-encoded FAKE values (placeholders only, never real credentials).
# Each value was produced with:   echo -n '<value>' | base64
#   echo -n 'demo_user'          | base64   -> ZGVtb191c2Vy
#   echo -n 'fake-password-123'  | base64   -> ZmFrZS1wYXNzd29yZC0xMjM=
#   echo -n 'demo_db'            | base64   -> ZGVtb19kYg==
# NOTE: base64 is encoding, not encryption. Anyone can decode it. See README "Why Secrets must not be committed to Git".
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: s12
  labels:
    app: secret-demo
type: Opaque
data:
  DB_USER: ZGVtb191c2Vy
  DB_PASSWORD: ZmFrZS1wYXNzd29yZC0xMjM=
  DB_NAME: ZGVtb19kYg==

# SCENARIO 1 (BROKEN): the Pod asks for Secret key "DB_PASS", but the Secret only has "DB_PASSWORD".
# Symptom: Pod stuck in CreateContainerConfigError.
apiVersion: v1
kind: Secret
metadata:
  name: ts-db-secret
  namespace: s12
type: Opaque
stringData:
  DB_USER: demo_user
  DB_PASSWORD: fake-password-123
---
apiVersion: v1
kind: Pod
metadata:
  name: ts-secret-pod
  namespace: s12
  labels:
    scenario: "1"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"user=$DB_USER pass_len=${#DB_PASSWORD}\"; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ts-db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ts-db-secret
              key: DB_PASS        # <-- BUG: key does not exist in the Secret

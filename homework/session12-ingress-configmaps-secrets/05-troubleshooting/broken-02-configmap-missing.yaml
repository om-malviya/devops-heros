# SCENARIO 2 (BROKEN): the Pod references ConfigMap "app-confg" (typo). The real one is "app-config".
# Symptom: Pod stuck in CreateContainerConfigError, event "configmap "app-confg" not found".
apiVersion: v1
kind: Pod
metadata:
  name: ts-configmap-pod
  namespace: s12
  labels:
    scenario: "2"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"APP_ENV=$APP_ENV LOG_LEVEL=$LOG_LEVEL\"; sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-confg        # <-- BUG: typo, this ConfigMap does not exist

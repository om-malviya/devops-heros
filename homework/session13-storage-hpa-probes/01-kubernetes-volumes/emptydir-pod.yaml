# emptyDir shared by two containers in the same Pod.
# "writer" appends a line every 5s; "reader" (nginx) serves the same directory at /usr/share/nginx/html.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: s13
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date) written by writer container\" >> /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: shared
          mountPath: /data
    - name: reader
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared
      emptyDir: {}          # add  sizeLimit: 100Mi  or  medium: Memory  (tmpfs) if needed

# hostPath mounts a directory of the NODE into the Pod. Data survives Pod deletion but is tied to that node.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: s13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: host-storage
          mountPath: /data
  volumes:
    - name: host-storage
      hostPath:
        path: /tmp/s13-hostpath-data
        type: DirectoryOrCreate

# Static provisioning step 3: a Pod uses the claim. Delete/recreate the Pod and /data is still there.
apiVersion: v1
kind: Pod
metadata:
  name: static-pvc-demo
  namespace: s13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: static-pvc

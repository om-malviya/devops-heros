# Task 2 - load generator: three busybox pods hammering the Service in a tight wget loop.
# Scale replicas up/down to change the load:  kubectl scale -n s13 deploy/load-generator --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13
  labels:
    app: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: wget
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://cpu-app.s13.svc.cluster.local/ > /dev/null; done"]
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi

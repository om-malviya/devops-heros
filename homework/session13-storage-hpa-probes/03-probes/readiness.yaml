# Readiness: "can you take traffic?" - failing removes the Pod from Service endpoints, no restart.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: s13
  labels:
    app: readiness-demo
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /          # change to /wrong-path: STATUS stays Running, READY becomes 0/1
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-service
  namespace: s13
spec:
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 80

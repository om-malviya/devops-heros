# Load generator from the course README, as a Deployment so it can be scaled. nginx:alpine serving a
# static page uses little CPU per request: 4 tight wget loops only reached ~47% on 2 x 100m pods, so 8 are used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  replicas: 8
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: wget
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://web-service > /dev/null; done"]
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi

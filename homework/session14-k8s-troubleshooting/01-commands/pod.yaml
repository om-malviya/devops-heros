# Demo Pod with two containers so that -c (container) flags can be practised.
apiVersion: v1
kind: Pod
metadata:
  name: cmd-demo
  namespace: s14
  labels:
    app: cmd-demo
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    - name: sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "sidecar started"
          while true; do
            echo "heartbeat $(date +%T)"
            sleep 10
          done
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi

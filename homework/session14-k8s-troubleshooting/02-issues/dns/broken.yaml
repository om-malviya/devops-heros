apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: s14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: s14
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
# BUG: the client uses the wrong Service name (api-service) and, in the second
# attempt, the wrong namespace (default). Both names do not resolve -> NXDOMAIN.
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  namespace: s14
spec:
  containers:
    - name: client
      image: busybox:1.36
      env:
        - name: API_URL
          value: "http://api-service:8080/hostname"
      command:
        - sh
        - -c
        - |
          echo "Calling $API_URL"
          wget -qO- --timeout=3 "$API_URL" || echo "ERROR: could not reach $API_URL"
          echo "Calling http://api-svc.default:8080/hostname"
          wget -qO- --timeout=3 http://api-svc.default:8080/hostname || echo "ERROR: could not reach api-svc.default"
          sleep 3600

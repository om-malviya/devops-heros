apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: s14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          # the process listens on 8080 ...
          args: ["netexec", "--http-port=8080"]
          ports:
            # BUG 1: ... but the manifest claims port 80 (misleading, and the Service copies the mistake)
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo-svc
  namespace: s14
spec:
  selector:
    app: echo
  ports:
    - port: 80
      # BUG 1 (continued): targetPort 80 - nothing listens there -> "connection refused"
      targetPort: 80
---
# BUG 2: a default-deny NetworkPolicy blocks all ingress to every Pod in s14 -> "timed out"
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: s14
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: s14
  labels:
    role: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: s14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            # FIX 1: containerPort documents the real listening port
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: echo-svc
  namespace: s14
spec:
  selector:
    app: echo
  ports:
    - port: 80
      # FIX 1: targetPort points at the port the process listens on (named port)
      targetPort: http
---
# FIX 2: keep default-deny but explicitly allow ingress from Pods labelled role=client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: s14
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-echo
  namespace: s14
spec:
  podSelector:
    matchLabels:
      app: echo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: client
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: s14
  labels:
    role: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]

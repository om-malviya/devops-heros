apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: s14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
# BUG: the Service selector (app=web-frontend) does not match the Pod label (app=web),
# so the Service has no endpoints and every request to it fails.
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: s14
spec:
  type: ClusterIP
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
---
# Client Pod used to test the Service from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: s14
  labels:
    role: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]

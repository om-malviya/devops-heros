apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooting-app
  namespace: s14
  labels:
    app: troubleshooting-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshooting-app
  template:
    metadata:
      labels:
        app: troubleshooting-app
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

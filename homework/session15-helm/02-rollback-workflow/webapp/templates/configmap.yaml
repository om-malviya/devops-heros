apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  MESSAGE: {{ .Values.message | quote }}
  index.html: |
    <html><body>
    <h1>{{ .Values.message }}</h1>
    <p>release={{ .Release.Name }} revision={{ .Release.Revision }} image={{ .Values.image.repository }}:{{ .Values.image.tag }}</p>
    </body></html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-devsecops-api
  labels:
    app: session17-devsecops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-devsecops-api
  template:
    metadata:
      labels:
        app: session17-devsecops-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # __IMAGE__ is replaced by the deploy-k8s job with ghcr.io/<owner>/session17-devsecops-api:<git sha>
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/om-malviya/devops-heros.git
    targetRevision: main
    path: homework/session21-final-devops-project/helm/taskboard
    helm:
      releaseName: taskboard
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: backend.image.tag
          value: "1.0.0"
        - name: frontend.image.tag
          value: "1.0.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    # production: automated sync but no auto-prune; a human confirms deletions
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

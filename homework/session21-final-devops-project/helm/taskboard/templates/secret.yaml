{{- if not .Values.postgres.existingSecret }}
# Chart-managed Secret (demo). For real clusters set postgres.existingSecret to a Secret created out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-secrets
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "taskboard.databaseUrl" . | quote }}
{{- end }}

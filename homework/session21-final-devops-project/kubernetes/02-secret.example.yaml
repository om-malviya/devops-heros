# Template: copy to 02-secret.yaml and replace every <...> value, or create it imperatively:
#   kubectl -n taskboard create secret generic taskboard-secrets \
#     --from-literal=POSTGRES_USER=taskboard \
#     --from-literal=POSTGRES_PASSWORD='<STRONG_PASSWORD>' \
#     --from-literal=DATABASE_URL='postgresql+psycopg://taskboard:<STRONG_PASSWORD>@taskboard-postgres:5432/taskboard'
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: taskboard
type: Opaque
stringData:
  POSTGRES_USER: <DB_USER>
  POSTGRES_PASSWORD: <DB_PASSWORD>
  DATABASE_URL: postgresql+psycopg://<DB_USER>:<DB_PASSWORD>@taskboard-postgres:5432/taskboard

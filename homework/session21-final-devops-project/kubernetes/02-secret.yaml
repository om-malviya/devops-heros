# FAKE demo credentials for a local kind/minikube cluster only.
# In a real environment this file is NOT committed: create it from 02-secret.example.yaml,
# or let a secret manager (External Secrets / Sealed Secrets) generate it.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
type: Opaque
stringData:
  POSTGRES_USER: taskboard
  POSTGRES_PASSWORD: changeme-demo-password
  DATABASE_URL: postgresql+psycopg://taskboard:changeme-demo-password@taskboard-postgres:5432/taskboard

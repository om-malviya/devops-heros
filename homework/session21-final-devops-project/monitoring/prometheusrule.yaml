apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskboard-alerts
  namespace: taskboard
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: taskboard
spec:
  groups:
    - name: taskboard.availability
      rules:
        - alert: TaskboardBackendDown
          expr: sum(up{namespace="taskboard", job=~".*backend.*"}) == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "TaskBoard backend has no healthy scrape targets"
            description: "Prometheus cannot scrape any backend pod in namespace taskboard for 2 minutes."
        - alert: TaskboardPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="taskboard"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Pod {{ $labels.pod }} restarted more than 3 times in 15m"
        - alert: TaskboardPodNotReady
          expr: sum by (pod) (kube_pod_status_ready{namespace="taskboard", condition="false"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Pod {{ $labels.pod }} has been NotReady for 10 minutes"
    - name: taskboard.traffic
      rules:
        - alert: TaskboardHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="taskboard", handler=~"/api.*", status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{namespace="taskboard", handler=~"/api.*"}[5m])) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "More than 5% of API requests return 5xx"
        - alert: TaskboardHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="taskboard", handler=~"/api.*"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "p95 API latency above 500 ms"
        - alert: TaskboardHpaAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="taskboard"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="taskboard"}
          for: 10m
          labels: {severity: info}
          annotations:
            summary: "Backend HPA has been at max replicas for 10 minutes - consider raising the limit"

# FIXED version of scenario 1. Apply with: kubectl apply -f fixed.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels:
    app: taskboard-backend
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: taskboard-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: ghcr.io/om-malviya/taskboard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskboard-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskboard-secrets
                  key: DATABASE_URL
          # startupProbe gives the Alembic migration time to finish before liveness kicks in
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24       # 2 minutes
          readinessProbe:
            httpGet:
              path: /ready             # verifies DB connectivity
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the app writes nothing to disk (PYTHONDONTWRITEBYTECODE=1)
            capabilities:
              drop: ["ALL"]
